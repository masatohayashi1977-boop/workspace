<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>社労士ゲーム</title>

    <style>
        /* リセットとベーススタイル */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4285f4;
            --secondary-color: #34a853;
            --danger-color: #ea4335;
            --warning-color: #fbbc04;
            --dark-color: #202124;
            --light-color: #f8f9fa;
            --border-color: #dadce0;
            --text-color: #202124;
            --text-secondary: #5f6368;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
            --shadow-lg: 0 10px 20px rgba(0, 0, 0, 0.15), 0 3px 6px rgba(0, 0, 0, 0.10);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--dark-color);
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .admin-link {
            position: absolute;
            right: 1rem;
            top: 1rem;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
        }

        /* メインコンテンツ */
        .main-content {
            flex: 1;
            padding: 1.5rem;
        }

        /* ステップの表示/非表示 */
        .step {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* カード */
        .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--dark-color);
        }

        /* フォーム要素 */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: white;
            transition: all 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }

        /* チェックボックスグループ */
        .checkbox-group {
            margin-bottom: 1.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: var(--light-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .checkbox-label:hover {
            background: #e8f0fe;
        }

        .checkbox-label input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkbox-custom {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            margin-right: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            transition: all 0.2s;
        }

        .checkbox-label input[type="checkbox"]:checked ~ .checkbox-custom {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .checkbox-label input[type="checkbox"]:checked ~ .checkbox-custom::after {
            content: "✓";
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        /* ボタン */
        .btn {
            padding: 0.875rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
            display: inline-block;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #3367d6;
        }

        .btn-secondary {
            background: var(--light-color);
            color: var(--text-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--border-color);
        }

        .btn-success {
            background: var(--secondary-color);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #2d8e47;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        /* 録音セクション */
        .recording-status {
            text-align: center;
            margin-bottom: 2rem;
        }

        .recording-indicator {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--light-color);
            border-radius: 20px;
            margin-bottom: 1rem;
        }

        .recording-indicator.recording {
            background: var(--danger-color);
            animation: pulse 1.5s infinite;
        }

        .recording-indicator.recording .status-text {
            color: white;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .status-text {
            font-weight: 600;
            color: var(--text-color);
        }

        .timer {
            font-size: 2.5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            color: var(--dark-color);
            margin-bottom: 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--light-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s linear;
        }

        .progress-fill.recording {
            background: var(--danger-color);
        }

        /* マイクボタン */
        .mic-button-container {
            display: flex;
            justify-content: center;
            margin: 2rem 0;
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .mic-button:hover {
            transform: scale(1.05);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-button.recording {
            background: var(--danger-color);
            animation: pulse 1.5s infinite;
        }

        /* 文字起こし表示 */
        .transcript-container {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--light-color);
            border-radius: 8px;
        }

        .transcript-container h3 {
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
        }

        .transcript-text {
            max-height: 200px;
            overflow-y: auto;
            padding: 0.75rem;
            background: white;
            border-radius: 6px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* 完了画面 */
        .success-message {
            text-align: center;
            padding: 2rem 0;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: var(--secondary-color);
            color: white;
            font-size: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        /* フッター */
        .footer {
            background: rgba(255, 255, 255, 0.95);
            padding: 1rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* ローディングオーバーレイ */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* エラーメッセージ */
        .error-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--danger-color);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            max-width: 90%;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .info-text {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        /* レスポンシブ対応 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 1.5rem;
            }

            .card h2 {
                font-size: 1.3rem;
            }

            .main-content {
                padding: 1rem;
            }

            .mic-button {
                width: 100px;
                height: 100px;
            }

            .timer {
                font-size: 2rem;
            }
        }

        /* タッチデバイス用の調整 */
        @media (hover: none) {
            .btn:hover {
                transform: none;
            }

            .mic-button:hover {
                transform: none;
            }

            .checkbox-label:hover {
                background: var(--light-color);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <a href="?page=admin" class="admin-link">⚙️ 管理</a>
            <h1>🎮 社労士ゲーム</h1>
            <p class="subtitle">プレゼンテーション練習</p>
        </header>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- ステップ1: プレイヤー選択 -->
            <section id="step1" class="step active">
                <div class="card">
                    <h2>👤 プレイヤー選択</h2>
                    <div class="form-group">
                        <label for="playerSelect">プレイヤー名を選択してください</label>
                        <select id="playerSelect" class="input-field">
                            <option value="">選択してください...</option>
                        </select>
                    </div>
                    <button id="nextToIndustry" class="btn btn-primary" disabled>次へ</button>
                </div>
            </section>

            <!-- ステップ2: 業界選択 -->
            <section id="step2" class="step">
                <div class="card">
                    <h2>🏭 業界選択</h2>
                    <p class="info-text">対象業界を選択してください（複数選択可）</p>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="industry" value="製造業界">
                            <span class="checkbox-custom"></span>
                            製造業界
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="industry" value="運送業界">
                            <span class="checkbox-custom"></span>
                            運送業界
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="industry" value="建設業界">
                            <span class="checkbox-custom"></span>
                            建設業界
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="industry" value="介護業界">
                            <span class="checkbox-custom"></span>
                            介護業界
                        </label>
                    </div>
                    <div class="button-group">
                        <button id="backToPlayer" class="btn btn-secondary">戻る</button>
                        <button id="nextToRecording" class="btn btn-primary" disabled>次へ</button>
                    </div>
                </div>
            </section>

            <!-- ステップ3: 音声録音 -->
            <section id="step3" class="step">
                <div class="card">
                    <h2>🎤 プレゼンテーション録音</h2>
                    <p class="info-text">マイクボタンを押して、約1.5分間のプレゼンテーションを行ってください</p>

                    <!-- 録音状態の表示 -->
                    <div class="recording-status">
                        <div id="recordingIndicator" class="recording-indicator">
                            <span class="status-text">準備完了</span>
                        </div>
                        <div id="timer" class="timer">00:00</div>
                        <div class="progress-bar">
                            <div id="progressFill" class="progress-fill"></div>
                        </div>
                    </div>

                    <!-- マイクボタン -->
                    <div class="mic-button-container">
                        <button id="micButton" class="mic-button" aria-label="録音開始/停止">
                            <svg width="60" height="60" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- 文字起こしテキスト表示 -->
                    <div id="transcriptContainer" class="transcript-container" style="display: none;">
                        <h3>📝 文字起こし</h3>
                        <div id="transcriptText" class="transcript-text"></div>
                    </div>

                    <div class="button-group">
                        <button id="backToIndustry" class="btn btn-secondary">戻る</button>
                        <button id="submitData" class="btn btn-success" disabled>送信</button>
                    </div>
                </div>
            </section>

            <!-- ステップ4: 完了画面 -->
            <section id="step4" class="step">
                <div class="card">
                    <div class="success-message">
                        <div class="success-icon">✓</div>
                        <h2>送信完了！</h2>
                        <p>プレゼンテーションデータが保存されました。</p>
                    </div>
                    <button id="restart" class="btn btn-primary">最初から始める</button>
                </div>
            </section>
        </main>

        <!-- フッター -->
        <footer class="footer">
            <p>&copy; 2024 社労士ゲーム</p>
        </footer>
    </div>

    <!-- ローディングオーバーレイ -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p>読み込み中...</p>
    </div>

    <!-- エラーメッセージ -->
    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <script>
        // グローバル変数
        let currentStep = 1;
        let selectedPlayer = null;
        let selectedIndustries = [];
        let transcriptText = '';
        let recognition = null;
        let recordingTimer = null;
        let recordingStartTime = null;
        const MAX_RECORDING_TIME = 90; // 1.5分 = 90秒

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('アプリ初期化中...');
            initializeApp();
        });

        /**
         * アプリの初期化
         */
        async function initializeApp() {
            // 音声認識の初期化
            initializeSpeechRecognition();

            // イベントリスナーの設定
            setupEventListeners();

            // ユーザーリストの読み込み
            await loadUsers();

            console.log('初期化完了');
        }

        /**
         * Web Speech API の初期化
         */
        function initializeSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                showError('お使いのブラウザは音声認識に対応していません。Chrome、Edge、Safariをお使いください。');
                console.error('Speech Recognition not supported');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                console.log('音声認識開始');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                transcriptText += finalTranscript;
                updateTranscriptDisplay(transcriptText + interimTranscript);
            };

            recognition.onerror = (event) => {
                console.error('音声認識エラー:', event.error);
                if (event.error === 'no-speech') {
                    if (isRecording()) {
                        recognition.start();
                    }
                } else if (event.error !== 'aborted') {
                    showError('音声認識エラー: ' + event.error);
                }
            };

            recognition.onend = () => {
                console.log('音声認識終了');
                if (isRecording() && getRecordingTime() < MAX_RECORDING_TIME) {
                    recognition.start();
                }
            };
        }

        /**
         * イベントリスナーの設定
         */
        function setupEventListeners() {
            document.getElementById('playerSelect').addEventListener('change', (e) => {
                selectedPlayer = e.target.value;
                document.getElementById('nextToIndustry').disabled = !selectedPlayer;
            });

            document.getElementById('nextToIndustry').addEventListener('click', () => {
                goToStep(2);
            });

            document.querySelectorAll('input[name="industry"]').forEach(checkbox => {
                checkbox.addEventListener('change', updateIndustrySelection);
            });

            document.getElementById('backToPlayer').addEventListener('click', () => {
                goToStep(1);
            });

            document.getElementById('nextToRecording').addEventListener('click', () => {
                goToStep(3);
            });

            document.getElementById('micButton').addEventListener('click', toggleRecording);

            document.getElementById('backToIndustry').addEventListener('click', () => {
                if (!isRecording()) {
                    goToStep(2);
                } else {
                    showError('録音を停止してから戻ってください');
                }
            });

            document.getElementById('submitData').addEventListener('click', submitPlayData);

            document.getElementById('restart').addEventListener('click', resetApp);
        }

        /**
         * ユーザーリストの読み込み
         */
        async function loadUsers() {
            try {
                showLoading(true);

                // GASの関数を呼び出し
                google.script.run
                    .withSuccessHandler((users) => {
                        const select = document.getElementById('playerSelect');
                        select.innerHTML = '<option value="">選択してください...</option>';

                        users.forEach(user => {
                            const option = document.createElement('option');
                            option.value = user.name;
                            option.textContent = user.name;
                            select.appendChild(option);
                        });

                        showLoading(false);
                    })
                    .withFailureHandler((error) => {
                        showLoading(false);
                        console.error('ユーザー読み込みエラー:', error);
                        showError('ユーザーリストの読み込みに失敗しました');
                    })
                    .getAllUsers();

            } catch (error) {
                showLoading(false);
                console.error('ユーザー読み込みエラー:', error);
                showError('ユーザーリストの読み込みに失敗しました');
            }
        }

        /**
         * 業界選択の更新
         */
        function updateIndustrySelection() {
            selectedIndustries = Array.from(
                document.querySelectorAll('input[name="industry"]:checked')
            ).map(cb => cb.value);

            document.getElementById('nextToRecording').disabled = selectedIndustries.length === 0;
        }

        /**
         * ステップ遷移
         */
        function goToStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step${step}`).classList.add('active');
            currentStep = step;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /**
         * 録音の開始/停止
         */
        function toggleRecording() {
            if (!recognition) {
                showError('音声認識が利用できません');
                return;
            }

            if (isRecording()) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        /**
         * 録音開始
         */
        function startRecording() {
            console.log('録音開始');

            document.getElementById('micButton').classList.add('recording');
            document.getElementById('recordingIndicator').classList.add('recording');
            document.querySelector('.status-text').textContent = '録音中';
            document.getElementById('progressFill').classList.add('recording');
            document.getElementById('transcriptContainer').style.display = 'block';

            recordingStartTime = Date.now();
            recordingTimer = setInterval(updateTimer, 100);

            transcriptText = '';
            recognition.start();
        }

        /**
         * 録音停止
         */
        function stopRecording() {
            console.log('録音停止');

            document.getElementById('micButton').classList.remove('recording');
            document.getElementById('recordingIndicator').classList.remove('recording');
            document.querySelector('.status-text').textContent = '録音完了';
            document.getElementById('progressFill').classList.remove('recording');

            clearInterval(recordingTimer);
            recordingTimer = null;
            recordingStartTime = null;

            if (recognition) {
                recognition.stop();
            }

            document.getElementById('submitData').disabled = transcriptText.trim() === '';
        }

        /**
         * 録音中かどうか
         */
        function isRecording() {
            return recordingTimer !== null;
        }

        /**
         * 録音時間を取得（秒）
         */
        function getRecordingTime() {
            if (!recordingStartTime) return 0;
            return Math.floor((Date.now() - recordingStartTime) / 1000);
        }

        /**
         * タイマー更新
         */
        function updateTimer() {
            const elapsed = getRecordingTime();

            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            const progress = Math.min((elapsed / MAX_RECORDING_TIME) * 100, 100);
            document.getElementById('progressFill').style.width = `${progress}%`;

            if (elapsed >= MAX_RECORDING_TIME) {
                stopRecording();
                showError('録音時間が1.5分に達しました');
            }
        }

        /**
         * 文字起こしテキストの更新
         */
        function updateTranscriptDisplay(text) {
            document.getElementById('transcriptText').textContent = text;
            const container = document.getElementById('transcriptText');
            container.scrollTop = container.scrollHeight;
        }

        /**
         * データの送信
         */
        async function submitPlayData() {
            if (!selectedPlayer || selectedIndustries.length === 0 || !transcriptText.trim()) {
                showError('必要な情報が不足しています');
                return;
            }

            const playData = {
                playerName: selectedPlayer,
                industry: selectedIndustries,
                response: transcriptText.trim(),
                consultationText: '',
                cardName: '',
                score: '',
                comment: '',
                advice: '',
                demo: ''
            };

            try {
                showLoading(true);

                // GASの関数を呼び出し
                google.script.run
                    .withSuccessHandler((result) => {
                        console.log('送信成功:', result);
                        showLoading(false);
                        goToStep(4);
                    })
                    .withFailureHandler((error) => {
                        showLoading(false);
                        console.error('送信エラー:', error);
                        showError('データの送信に失敗しました');
                    })
                    .savePlayData(playData);

            } catch (error) {
                showLoading(false);
                console.error('送信エラー:', error);
                showError('データの送信に失敗しました');
            }
        }

        /**
         * アプリのリセット
         */
        function resetApp() {
            currentStep = 1;
            selectedPlayer = null;
            selectedIndustries = [];
            transcriptText = '';

            document.getElementById('playerSelect').value = '';
            document.querySelectorAll('input[name="industry"]').forEach(cb => {
                cb.checked = false;
            });
            document.getElementById('transcriptText').textContent = '';
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('progressFill').style.width = '0%';

            document.getElementById('nextToIndustry').disabled = true;
            document.getElementById('nextToRecording').disabled = true;
            document.getElementById('submitData').disabled = true;

            goToStep(1);
        }

        /**
         * ローディング表示の切り替え
         */
        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        /**
         * エラーメッセージの表示
         */
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';

            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
