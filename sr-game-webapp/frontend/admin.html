<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理者画面 - 社労士ゲーム</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .admin-header {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .admin-section {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .user-list {
            margin-top: 1.5rem;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--light-color);
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            color: var(--dark-color);
        }

        .user-email {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .user-id {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-left: 1rem;
        }

        .form-grid {
            display: grid;
            gap: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .stat-card {
            background: var(--light-color);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .back-link {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            margin-bottom: 1rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <a href="index.html" class="back-link">← ゲーム画面に戻る</a>

        <!-- ヘッダー -->
        <div class="admin-header">
            <h1>🔧 管理者画面</h1>
            <p class="subtitle">ユーザー管理とデータ確認</p>
        </div>

        <!-- 統計情報 -->
        <div class="admin-section">
            <h2>📊 統計情報</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">登録ユーザー数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalPlays">0</div>
                    <div class="stat-label">総プレイ数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="todayPlays">0</div>
                    <div class="stat-label">今日のプレイ数</div>
                </div>
            </div>
        </div>

        <!-- ユーザー登録フォーム -->
        <div class="admin-section">
            <h2>👤 新規ユーザー登録</h2>
            <form id="registerForm" class="form-grid">
                <div class="form-group">
                    <label for="userName">名前 *</label>
                    <input type="text" id="userName" class="input-field" required placeholder="例: 田中太郎">
                </div>
                <div class="form-group">
                    <label for="userEmail">メールアドレス（任意）</label>
                    <input type="email" id="userEmail" class="input-field" placeholder="例: tanaka@example.com">
                </div>
                <button type="submit" class="btn btn-primary">ユーザーを登録</button>
            </form>
        </div>

        <!-- ユーザー一覧 -->
        <div class="admin-section">
            <h2>📋 登録ユーザー一覧</h2>
            <button id="refreshUsers" class="btn btn-secondary" style="margin-bottom: 1rem;">
                🔄 更新
            </button>
            <div id="userList" class="user-list">
                <!-- ユーザー一覧がここに表示されます -->
            </div>
        </div>

        <!-- スプレッドシートへのリンク -->
        <div class="admin-section">
            <h2>🔗 スプレッドシート</h2>
            <p class="info-text">Google Apps ScriptのログからスプレッドシートのURLを確認してください。</p>
            <div class="form-group">
                <label for="spreadsheetUrl">スプレッドシートURL（任意）</label>
                <input type="url" id="spreadsheetUrl" class="input-field" placeholder="https://docs.google.com/spreadsheets/d/...">
            </div>
            <button id="openSpreadsheet" class="btn btn-secondary">スプレッドシートを開く</button>
        </div>
    </div>

    <!-- ローディングオーバーレイ -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p>読み込み中...</p>
    </div>

    <!-- 成功メッセージ -->
    <div id="successMessage" class="error-message" style="display: none; background: var(--secondary-color);"></div>

    <!-- エラーメッセージ -->
    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <script src="admin.js"></script>
</body>
</html>
