<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusHub - 勤怠管理ダッシュボード</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/96/clock.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, rgba(15, 32, 39, 0.95) 0%, rgba(32, 58, 67, 0.95) 100%);
      border-radius: 16px;
      padding: 20px 30px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    h1 {
      color: #e8eaf6;
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 36px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .user-email {
      font-size: 14px;
      font-weight: 700;
      color: #e8eaf6;
    }

    .clock {
      font-size: 20px;
      font-weight: 700;
      color: #667eea;
    }

    .filter-section {
      background: linear-gradient(135deg, rgba(15, 32, 39, 0.95) 0%, rgba(32, 58, 67, 0.95) 100%);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .filter-header h2 {
      color: #e8eaf6;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-filter {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .date-filter input, .date-filter select {
      background: rgba(15, 32, 39, 0.6);
      color: #e8eaf6;
      border: 2px solid rgba(232, 234, 246, 0.2);
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 14px;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .date-filter input:focus, .date-filter select:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: rgba(15, 32, 39, 0.6);
      color: #c5cae9;
      border: 2px solid rgba(102, 126, 234, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(102, 126, 234, 0.3);
      border-color: #667eea;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
      border-radius: 16px;
      padding: 25px;
      border: 1px solid rgba(102, 126, 234, 0.2);
    }

    .summary-card h3 {
      color: #e8eaf6;
      font-size: 16px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-value {
      font-size: 36px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 8px;
    }

    .summary-label {
      font-size: 13px;
      color: #9fa8da;
    }

    .users-section, .entries-section {
      background: linear-gradient(135deg, rgba(15, 32, 39, 0.95) 0%, rgba(32, 58, 67, 0.95) 100%);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .section-header h2 {
      color: #e8eaf6;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .user-card {
      background: rgba(15, 32, 39, 0.6);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(232, 234, 246, 0.1);
      transition: all 0.3s ease;
    }

    .user-card:hover {
      background: rgba(102, 126, 234, 0.1);
      border-color: #667eea;
      transform: translateY(-2px);
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .user-name {
      font-size: 18px;
      font-weight: 700;
      color: #e8eaf6;
      margin-bottom: 4px;
    }

    .user-email {
      font-size: 13px;
      color: #9fa8da;
    }

    .user-hours {
      font-size: 28px;
      font-weight: 700;
      color: #43e97b;
      text-align: right;
    }

    .user-stats {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(232, 234, 246, 0.1);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 11px;
      color: #9fa8da;
      margin-top: 4px;
    }

    .user-projects {
      margin-top: 15px;
    }

    .project-tag {
      display: inline-block;
      background: rgba(102, 126, 234, 0.2);
      color: #e8eaf6;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      margin: 4px 4px 0 0;
    }

    .entries-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .entries-table th {
      background: rgba(102, 126, 234, 0.2);
      color: #e8eaf6;
      padding: 12px;
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      border-bottom: 2px solid rgba(102, 126, 234, 0.3);
    }

    .entries-table td {
      padding: 15px 12px;
      border-bottom: 1px solid rgba(232, 234, 246, 0.1);
      color: #c5cae9;
      font-size: 13px;
    }

    .entries-table tr:hover {
      background: rgba(102, 126, 234, 0.1);
    }

    .duration-badge {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      color: #1a1a2e;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
      display: inline-block;
    }

    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: #9fa8da;
    }

    .spinner {
      border: 4px solid rgba(102, 126, 234, 0.2);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .no-data {
      text-align: center;
      color: #9fa8da;
      padding: 40px;
      font-size: 16px;
    }

    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(15, 32, 39, 0.6);
      color: #9fa8da;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    @media (max-width: 768px) {
      .date-filter {
        flex-direction: column;
        align-items: stretch;
      }

      .date-filter input, .date-filter select {
        width: 100%;
      }

      .users-grid {
        grid-template-columns: 1fr;
      }

      .entries-table {
        font-size: 12px;
      }

      .entries-table th, .entries-table td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>
          <span class="logo">📊</span>
          勤怠管理ダッシュボード
        </h1>
      </div>
      <div class="user-info">
        <div class="user-email" id="userEmail">読み込み中...</div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <!-- フィルターセクション -->
    <div class="filter-section">
      <div class="filter-header">
        <h2><span class="material-icons">filter_list</span>フィルター</h2>
      </div>
      <div class="date-filter">
        <input type="date" id="startDateFilter" class="form-input">
        <span style="color: #9fa8da;">〜</span>
        <input type="date" id="endDateFilter" class="form-input">
        <select id="periodFilter" class="form-select" onchange="applyPeriodFilter()">
          <option value="">期間を選択...</option>
          <option value="today">今日</option>
          <option value="yesterday">昨日</option>
          <option value="thisWeek">今週</option>
          <option value="lastWeek">先週</option>
          <option value="thisMonth">今月</option>
          <option value="lastMonth">先月</option>
        </select>
        <button class="btn btn-primary" onclick="loadData()">
          <span class="material-icons">search</span>
          表示
        </button>
        <button class="btn btn-secondary" onclick="exportData()">
          <span class="material-icons">download</span>
          エクスポート
        </button>
      </div>
    </div>

    <!-- サマリーカード -->
    <div class="summary-grid" id="summaryGrid">
      <div class="summary-card">
        <h3><span class="material-icons">people</span>アクティブユーザー</h3>
        <div class="summary-value" id="activeUsers">0</div>
        <div class="summary-label">人</div>
      </div>
      <div class="summary-card">
        <h3><span class="material-icons">schedule</span>総作業時間</h3>
        <div class="summary-value" id="totalHours">0.0</div>
        <div class="summary-label">時間</div>
      </div>
      <div class="summary-card">
        <h3><span class="material-icons">assignment</span>総エントリー数</h3>
        <div class="summary-value" id="totalEntries">0</div>
        <div class="summary-label">件</div>
      </div>
      <div class="summary-card">
        <h3><span class="material-icons">trending_up</span>平均作業時間</h3>
        <div class="summary-value" id="avgHours">0.0</div>
        <div class="summary-label">時間/人</div>
      </div>
    </div>

    <!-- タブ -->
    <div class="tab-container">
      <button class="tab active" onclick="switchTab('users')">
        <span class="material-icons" style="font-size: 16px; vertical-align: middle;">people</span>
        ユーザー別
      </button>
      <button class="tab" onclick="switchTab('entries')">
        <span class="material-icons" style="font-size: 16px; vertical-align: middle;">list</span>
        エントリー一覧
      </button>
    </div>

    <!-- ユーザー別タブ -->
    <div id="usersTab" class="tab-content active">
      <div class="users-section">
        <div class="section-header">
          <h2><span class="material-icons">people</span>ユーザー別サマリー</h2>
        </div>
        <div class="users-grid" id="usersGrid">
          <div class="loading-spinner">
            <div class="spinner"></div>
            <p>読み込み中...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- エントリー一覧タブ -->
    <div id="entriesTab" class="tab-content">
      <div class="entries-section">
        <div class="section-header">
          <h2><span class="material-icons">list</span>全エントリー一覧</h2>
        </div>
        <div id="entriesTable">
          <div class="loading-spinner">
            <div class="spinner"></div>
            <p>読み込み中...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'users';
    let allUsers = [];
    let allEntries = [];

    // 時計の更新
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const clockElement = document.getElementById('clock');
      if (clockElement) {
        clockElement.textContent = hours + ':' + minutes + ':' + seconds;
      }
    }

    updateClock();
    setInterval(updateClock, 1000);

    // ユーザー情報を取得
    google.script.run
      .withSuccessHandler(function(userInfo) {
        const emailElement = document.getElementById('userEmail');
        if (emailElement) {
          emailElement.textContent = userInfo.email + ' (管理者)';
        }
      })
      .getUserInfo();

    // 初期化
    function init() {
      // デフォルトの日付フィルターを設定（今月）
      const today = new Date();
      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);

      const startDateFilter = document.getElementById('startDateFilter');
      const endDateFilter = document.getElementById('endDateFilter');

      if (startDateFilter) {
        startDateFilter.value = formatDateInput(firstDay);
      }
      if (endDateFilter) {
        endDateFilter.value = formatDateInput(today);
      }

      loadData();
    }

    // 期間フィルターを適用
    function applyPeriodFilter() {
      const periodFilter = document.getElementById('periodFilter');
      const period = periodFilter ? periodFilter.value : '';

      if (!period) return;

      const today = new Date();
      let startDate, endDate;

      switch (period) {
        case 'today':
          startDate = new Date(today);
          endDate = new Date(today);
          break;
        case 'yesterday':
          startDate = new Date(today);
          startDate.setDate(today.getDate() - 1);
          endDate = new Date(startDate);
          break;
        case 'thisWeek':
          const dayOfWeek = today.getDay();
          startDate = new Date(today);
          startDate.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
          endDate = new Date(today);
          break;
        case 'lastWeek':
          const lastWeekEnd = new Date(today);
          lastWeekEnd.setDate(today.getDate() - today.getDay());
          endDate = new Date(lastWeekEnd);
          startDate = new Date(lastWeekEnd);
          startDate.setDate(lastWeekEnd.getDate() - 6);
          break;
        case 'thisMonth':
          startDate = new Date(today.getFullYear(), today.getMonth(), 1);
          endDate = new Date(today);
          break;
        case 'lastMonth':
          startDate = new Date(today.getFullYear(), today.getMonth() - 1, 1);
          endDate = new Date(today.getFullYear(), today.getMonth(), 0);
          break;
      }

      const startDateFilter = document.getElementById('startDateFilter');
      const endDateFilter = document.getElementById('endDateFilter');

      if (startDateFilter) startDateFilter.value = formatDateInput(startDate);
      if (endDateFilter) endDateFilter.value = formatDateInput(endDate);

      loadData();
    }

    // データを読み込み
    function loadData() {
      const startDateFilter = document.getElementById('startDateFilter');
      const endDateFilter = document.getElementById('endDateFilter');

      const startDate = startDateFilter ? startDateFilter.value : null;
      const endDate = endDateFilter ? endDateFilter.value : null;

      loadUsersSummary(startDate, endDate);
      loadAllEntries(startDate, endDate);
    }

    // ユーザー別サマリーを読み込み
    function loadUsersSummary(startDate, endDate) {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            allUsers = result.users;
            updateSummaryCards();
            displayUsers();
          } else {
            const grid = document.getElementById('usersGrid');
            if (grid) {
              grid.innerHTML = '<div class="no-data">データの取得に失敗しました</div>';
            }
          }
        })
        .withFailureHandler(function(error) {
          const grid = document.getElementById('usersGrid');
          if (grid) {
            grid.innerHTML = '<div class="no-data">データの取得に失敗しました</div>';
          }
        })
        .getUsersSummary(startDate, endDate);
    }

    // 全エントリーを読み込み
    function loadAllEntries(startDate, endDate) {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            allEntries = result.entries;
            displayEntries();
          } else {
            const table = document.getElementById('entriesTable');
            if (table) {
              table.innerHTML = '<div class="no-data">データの取得に失敗しました</div>';
            }
          }
        })
        .withFailureHandler(function(error) {
          const table = document.getElementById('entriesTable');
          if (table) {
            table.innerHTML = '<div class="no-data">データの取得に失敗しました</div>';
          }
        })
        .getAllTimeEntries(startDate, endDate);
    }

    // サマリーカードを更新
    function updateSummaryCards() {
      const activeUsers = allUsers.length;
      let totalMinutes = 0;
      let totalEntries = 0;

      allUsers.forEach(function(user) {
        totalMinutes += user.totalMinutes;
        totalEntries += user.entryCount;
      });

      const totalHours = (totalMinutes / 60).toFixed(1);
      const avgHours = activeUsers > 0 ? (totalMinutes / 60 / activeUsers).toFixed(1) : '0.0';

      const activeUsersElement = document.getElementById('activeUsers');
      if (activeUsersElement) activeUsersElement.textContent = activeUsers;

      const totalHoursElement = document.getElementById('totalHours');
      if (totalHoursElement) totalHoursElement.textContent = totalHours;

      const totalEntriesElement = document.getElementById('totalEntries');
      if (totalEntriesElement) totalEntriesElement.textContent = totalEntries;

      const avgHoursElement = document.getElementById('avgHours');
      if (avgHoursElement) avgHoursElement.textContent = avgHours;
    }

    // ユーザーを表示
    function displayUsers() {
      const grid = document.getElementById('usersGrid');
      if (!grid) return;

      if (allUsers.length === 0) {
        grid.innerHTML = '<div class="no-data">この期間のデータはありません</div>';
        return;
      }

      let html = '';
      allUsers.forEach(function(user) {
        html += '<div class="user-card">' +
                '<div class="user-header">' +
                '<div>' +
                '<div class="user-name">' + escapeHtml(user.name) + '</div>' +
                '<div class="user-email">' + escapeHtml(user.email) + '</div>' +
                '</div>' +
                '<div class="user-hours">' + user.totalHours + 'h</div>' +
                '</div>' +
                '<div class="user-stats">' +
                '<div class="stat-item">' +
                '<div class="stat-value">' + user.entryCount + '</div>' +
                '<div class="stat-label">エントリー数</div>' +
                '</div>' +
                '<div class="stat-item">' +
                '<div class="stat-value">' + Object.keys(user.projectTime).length + '</div>' +
                '<div class="stat-label">プロジェクト数</div>' +
                '</div>' +
                '</div>';

        if (user.projectTime && Object.keys(user.projectTime).length > 0) {
          html += '<div class="user-projects">';
          const projects = Object.entries(user.projectTime);
          projects.forEach(function([project, minutes]) {
            const hours = (minutes / 60).toFixed(1);
            html += '<span class="project-tag">' + escapeHtml(project) + ': ' + hours + 'h</span>';
          });
          html += '</div>';
        }

        html += '</div>';
      });

      grid.innerHTML = html;
    }

    // エントリーを表示
    function displayEntries() {
      const table = document.getElementById('entriesTable');
      if (!table) return;

      if (allEntries.length === 0) {
        table.innerHTML = '<div class="no-data">この期間のエントリーはありません</div>';
        return;
      }

      let html = '<table class="entries-table">' +
                 '<thead>' +
                 '<tr>' +
                 '<th>ユーザー</th>' +
                 '<th>日時</th>' +
                 '<th>開始時刻</th>' +
                 '<th>終了時刻</th>' +
                 '<th>作業時間</th>' +
                 '<th>プロジェクト</th>' +
                 '<th>タスク</th>' +
                 '<th>メモ</th>' +
                 '</tr>' +
                 '</thead>' +
                 '<tbody>';

      allEntries.forEach(function(entry) {
        const startTime = new Date(entry.startTime);
        const endTime = new Date(entry.endTime);
        const hours = Math.floor(entry.duration / 60);
        const minutes = entry.duration % 60;
        const durationText = hours + 'h ' + minutes + 'm';

        html += '<tr>' +
                '<td>' +
                '<div style="font-weight: 600;">' + escapeHtml(entry.name) + '</div>' +
                '<div style="font-size: 11px; color: #9fa8da;">' + escapeHtml(entry.email) + '</div>' +
                '</td>' +
                '<td>' + formatDate(startTime) + '</td>' +
                '<td>' + formatTime(startTime) + '</td>' +
                '<td>' + formatTime(endTime) + '</td>' +
                '<td><span class="duration-badge">' + durationText + '</span></td>' +
                '<td>' + escapeHtml(entry.project || '未分類') + '</td>' +
                '<td>' + escapeHtml(entry.task || '-') + '</td>' +
                '<td>' + escapeHtml(entry.memo || '-') + '</td>' +
                '</tr>';
      });

      html += '</tbody></table>';
      table.innerHTML = html;
    }

    // タブを切り替え
    function switchTab(tab) {
      currentTab = tab;

      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(function(t) {
        t.classList.remove('active');
      });

      const tabContents = document.querySelectorAll('.tab-content');
      tabContents.forEach(function(tc) {
        tc.classList.remove('active');
      });

      if (tab === 'users') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('usersTab').classList.add('active');
      } else if (tab === 'entries') {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('entriesTab').classList.add('active');
      }
    }

    // データをエクスポート
    function exportData() {
      const startDateFilter = document.getElementById('startDateFilter');
      const endDateFilter = document.getElementById('endDateFilter');

      const startDate = startDateFilter ? startDateFilter.value : '';
      const endDate = endDateFilter ? endDateFilter.value : '';

      let csv = 'ユーザー名,メールアドレス,日付,開始時刻,終了時刻,作業時間(分),プロジェクト,タスク,メモ\n';

      allEntries.forEach(function(entry) {
        const startTime = new Date(entry.startTime);
        const endTime = new Date(entry.endTime);

        csv += '"' + entry.name + '",' +
               '"' + entry.email + '",' +
               '"' + formatDate(startTime) + '",' +
               '"' + formatTime(startTime) + '",' +
               '"' + formatTime(endTime) + '",' +
               entry.duration + ',' +
               '"' + (entry.project || '') + '",' +
               '"' + (entry.task || '') + '",' +
               '"' + (entry.memo || '') + '"\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);

      link.setAttribute('href', url);
      link.setAttribute('download', 'time_tracking_' + startDate + '_' + endDate + '.csv');
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // ヘルパー関数
    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return year + '/' + month + '/' + day;
    }

    function formatTime(date) {
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return hours + ':' + minutes;
    }

    function formatDateInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 初期化
    init();

    // 定期的に更新
    setInterval(function() {
      loadData();
    }, 60000);
  </script>
</body>
</html>
